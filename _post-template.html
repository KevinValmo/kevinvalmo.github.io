<!doctype html>
<!--
  NEW POST TEMPLATE — copy this file to blog/<slug>.html, then:
  1. Replace every {{PLACEHOLDER}} (title, subtitle, description, slug, dates,
     image, tags). {{SUBTITLE}} is the short line shown under the title;
     {{DESCRIPTION}} (meta + og) must be 100–160 characters: LinkedIn warns
     below 100, Google truncates above ~160.
  2. Images in public/: <name>.jpg cropped to 2:1 (max 1440px wide, JPEG q~80)
     and <name>.low.jpg cropped to 16:9 at 640x360 (JPEG q~75).
  3. Add the post card to blog/index.html (thumbnail = the .low.jpg variant).
  4. Add an <entry> to feed.xml and bump its <updated> date.
  5. Add the post URL to sitemap.xml.
  6. Delete this comment.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}} — Kevin Valmorbida</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Kevin Valmorbida" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="https://kevinvalmo.github.io/blog/{{SLUG}}" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Kevin Valmorbida" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta
      property="og:image"
      content="https://kevinvalmo.github.io/public/{{IMAGE}}.jpg"
    />
    <meta property="og:url" content="https://kevinvalmo.github.io/blog/{{SLUG}}" />
    <meta property="article:published_time" content="{{DATE_ISO}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="../favicon.ico" sizes="32x32" />
    <link rel="icon" href="../public/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../public/apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="Kevin Valmorbida — Blog"
      href="/feed.xml"
    />
    <link rel="stylesheet" href="../public/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav aria-label="Main">
        <a href="/blog/">Blog <span aria-hidden="true">📖</span></a>
        <a href="/">About <span aria-hidden="true">🧑‍🦰</span></a>
        <a href="/design/">Design <span aria-hidden="true">🖋️</span></a>
      </nav>
    </header>

    <!-- Content -->
    <main class="container">
      <article>
        <div class="hero-image-wrap">
          <img
            src="../public/{{IMAGE}}.jpg"
            alt="{{IMAGE_ALT}}"
            width="{{IMAGE_WIDTH}}"
            height="{{IMAGE_HEIGHT}}"
            fetchpriority="high"
          />
          <span class="hero-caption">{{IMAGE_ALT}} - Kevin Valmorbida</span>
        </div>

        <h1>{{TITLE}}</h1>
        <p>
          <em>{{SUBTITLE}}</em>
        </p>

        <div class="post-meta">
          <div class="tags">
            <span class="tag">{{TAG}}</span>
          </div>
          <small
            ><em
              ><span aria-hidden="true">⏳</span> {{N}} min read &nbsp;|&nbsp;
              <time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time></em
            ></small
          >
        </div>

        <hr />

        <h2>{{SECTION}}</h2>
        <p>{{TEXT}}</p>

        <hr />

        <p><strong>Feel free to share with your friends!</strong></p>
        <p class="post-share">
          <a
            href="https://www.linkedin.com/feed/?shareActive=true&text=Check%20out%20this%20post!%20%F0%9F%9A%80%20https://kevinvalmo.github.io/blog/{{SLUG}}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span aria-hidden="true">💼</span> Share on LinkedIn
          </a>
        </p>

        <nav class="post-nav" aria-label="Blog">
          <a href="/blog/">← All posts</a>
        </nav>
      </article>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-inner">
        <span>Kevin Valmorbida - Software Engineer</span>
        <div class="footer-links">
          <a
            href="https://www.linkedin.com/in/kevinvalmorbida/"
            aria-label="LinkedIn"
          >
            💼
          </a>
          <a href="https://github.com/KevinValmo" aria-label="GitHub"> 🐙 </a>
        </div>
      </div>
    </footer>
  </body>
</html>
